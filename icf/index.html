  { key: 'c3', mandatory: true,  text: '나는 연구진, 연구기관 및 생명윤리심의위원회가 연구의 진행과 결과 확인을 위해 필요한 범위에서 비밀이 보장되는 나의 정보를 열람할 수 있음에 동의합니다.' },
  { key: 'c4', mandatory: true,  text: '나는 연구 수행을 위해 설명서에 기재된 개인정보를 수집·이용하는 데 동의합니다.' },
  { key: 'c5', mandatory: true,  text: '나는 EIT와 말하기 과제 수행 중 나의 음성이 녹음되고, 설명서에 기재된 기간 동안 보관되는 데 동의합니다.' },
  { key: 'c6', mandatory: false, text: '나는 개인식별정보를 제거한 EIT 응답 전사 자료가 학술 목적으로 공개 데이터 저장소에 공개되는 데 동의합니다. 공개 후에는 회수하거나 삭제할 수 없음을 이해합니다.' },
  { key: 'c7', mandatory: false, text: '나는 위 전사 자료가 향후 다른 연구 목적으로 2차 활용되는 데 동의합니다.' },
  { key: 'c8', mandatory: true,  text: '나는 서명한 동의서 사본을 받았으며, 연구 참여가 끝날 때까지 보관하겠습니다.' },
];

const PRIVACY_TABLE = [
  ['성명·연락처', '참여 확인 및 자료 삭제 요청 처리', '참여일로부터 14일'],
  ['계좌정보', '사례비 지급', '지급 후 폐기(회계 증빙 의무가 있는 경우 해당 기간 경과 후)'],
  ['음성 녹음', '응답 전사·채점·검증', '연구 종료 후 3년'],
];

const PRIVACY_NOTE = '※ 연구자료는 고유 코드로 관리하며, 음성 원본과 서면 동의서는 연구 종료 후 3년간 보관합니다. 성명·연락처와 코드의 연결표는 참여일로부터 14일 후 삭제되므로, 이후에는 개인 자료를 특정하여 삭제하기 어렵습니다.';

const FOOTER = '연구책임자 박해인: haeinpark@khu.ac.kr\n경희대학교 서울캠퍼스 생명윤리심의위원회(서울시 동대문구 경희대로 26): 02-961-2342';

var STEPS = ['연구대상자 설명서', '연구대상자 동의서', '동의 확인'];
var step = 0, A = {}, F = { name: '', sign: false }, sent = false;
var sid = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
var app = document.getElementById('app');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function panel(badge,title,body,cls,req){return '<section class="panel '+(cls||'')+'"><span class="badge">'+esc(badge)+'</span>'+(title?'<h2>'+esc(title)+(req?' <span class="req">*</span>':'')+'</h2>':'')+body+'</section>'}
function rows(t){return '<table>'+t.map(function(r){return '<tr><td class="k">'+esc(r[0])+'</td><td class="pre">'+esc(r[1])+'</td></tr>'}).join('')+'</table>'}
function today(){var d=new Date();return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일'}
function nav(back,label){return '<div class="status" id="status"></div><div class="nav">'+(back?'<button type="button" class="ghost" id="back">이전</button>':'<span></span>')+'<button type="button" id="next">'+esc(label)+'</button></div>'}

function render(){
 var h='';
 document.getElementById('hdr').className=step?'compact':'';
 document.getElementById('sub').textContent=step?'':STUDY.title;
 document.getElementById('bar').style.width=((step+1)/3*100)+'%';
 document.getElementById('stepno').textContent=(step+1)+' / 3 · '+STEPS[step];
 if(step===0){
  h+=panel('STUDY','연구대상자 설명서',rows(STUDY.meta)+'<p>'+esc(STUDY.intro)+'</p>','pk');
  INFO_SECTIONS.forEach(function(s,i){
   var b='';
   if(s.table)b+=rows(s.table);
   (s.paragraphs||[]).forEach(function(p){b+='<p class="pre">'+esc(p)+'</p>'});
   if(s.list)b+='<ul>'+s.list.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
   (s.afterList||[]).forEach(function(p){b+='<p>'+esc(p)+'</p>'});
   h+=panel('SECTION '+(i+1),s.heading,b);
  });
  h+=nav(false,'다음: 동의서');
 } else if(step===1){
  var it='';
  CONSENT_ITEMS.forEach(function(c,i){
   it+='<div class="item" data-k="'+c.key+'"><div class="t">'+(i+1)+'. '+esc(c.text)+(c.mandatory?'':'<span class="tag">선택</span>')+'</div><div class="yn">'+
    [YES,NO].map(function(o){return '<label class="'+(o===NO?'no':'')+'"><input type="radio" name="'+c.key+'" value="'+o+'"'+(A[c.key]===o?' checked':'')+'>'+o+'</label>'}).join('')+
    '</div><div class="errmsg">응답해 주십시오.</div></div>';
  });
  h+=panel('CONSENT','연구대상자 동의서','<p><b>'+esc(STUDY.title)+'</b></p><p>'+esc(CONSENT_INTRO)+'</p>','pk');
  h+=panel('ITEMS','동의 항목',it+'<div id="stopmsg"></div>','',true);
  h+=panel('PRIVACY','개인정보 수집 항목 및 보유기간','<table><tr><th>수집 항목</th><th>수집 목적</th><th>보유기간</th></tr>'+PRIVACY_TABLE.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table><p class="note">'+esc(PRIVACY_NOTE)+'</p>');
  h+=nav(true,'다음: 동의 확인');
 } else {
  var f='';
  f+='<div class="field" data-k="name"><span class="q">연구대상자 성명 <span class="req">*</span></span><p class="hint">서명 대신 성명을 입력합니다.</p><input type="text" id="name" autocomplete="off" value="'+esc(F.name)+'"><div class="errmsg">성명을 입력해 주십시오.</div></div>';
  f+='<div class="field" data-k="sign"><label class="chk"><input type="checkbox" id="sign"'+(F.sign?' checked':'')+'><span>위에 성명을 입력하고 제출함으로써 서명을 갈음하여 본 동의서에 동의합니다. <span class="req">*</span></span></label><div class="errmsg">확인란에 표시해 주십시오.</div></div>';
  f+='<div class="field"><span class="q">서명일</span><span class="fixed">'+today()+'</span><p class="hint" style="margin-top:6px">제출 시각으로 자동 기록됩니다.</p></div>';
  f+='<div class="field"><span class="q">연구설명자</span><span class="fixed">'+esc(CONFIG.EXPLAINER)+'</span></div>';
  h+=panel('SIGN','동의 확인',f);
  h+='<p class="note" style="margin-top:20px">'+esc(FOOTER).replace(/\n/g,'<br>')+'</p>';
  h+=nav(true,'동의서 제출');
 }
 app.innerHTML=h;
 var b=document.getElementById('back');if(b)b.onclick=function(){collect();step--;render();scrollTo(0,0)};
 document.getElementById('next').onclick=onNext;
 app.onchange=app.oninput=function(e){collect();var c=e.target.closest('.bad');if(c)c.classList.remove('bad');if(step===1)document.getElementById('stopmsg').innerHTML=''};
}
function collect(){
 if(step===1)app.querySelectorAll('input[type=radio]:checked').forEach(function(e){A[e.name]=e.value});
 if(step===2){F.name=document.getElementById('name').value.trim();F.sign=document.getElementById('sign').checked}
}
function mark(k,list){var c=app.querySelector('[data-k="'+k+'"]');if(c){c.classList.add('bad');list.push(c)}}
function onNext(){
 collect();
 var st=document.getElementById('status'),e=[];st.textContent='';
 app.querySelectorAll('.bad').forEach(function(c){c.classList.remove('bad')});
 if(step===1){
  CONSENT_ITEMS.forEach(function(c){if(!A[c.key])mark(c.key,e)});
  if(e.length){st.textContent='모든 항목에 응답해 주십시오.';e[0].scrollIntoView({block:'center'});return}
  var refused=CONSENT_ITEMS.filter(function(c){return c.mandatory&&A[c.key]===NO});
  if(refused.length){
   var nums=refused.map(function(c){return CONSENT_ITEMS.indexOf(c)+1}).join(', ');
   document.getElementById('stopmsg').innerHTML='<div class="stop">'+nums+'번 항목은 연구 참여에 필요한 사항입니다. 이 항목에 동의하지 않으시면 연구에 참여하실 수 없습니다. 연구조원에게 알려 주십시오.</div>';
   document.getElementById('stopmsg').scrollIntoView({block:'center'});return;
  }
 }
 if(step<2){step++;render();scrollTo(0,0);return}
 if(!F.name)mark('name',e);
 if(!F.sign)mark('sign',e);
 if(e.length){st.textContent='표시된 항목을 확인해 주십시오.';e[0].scrollIntoView({block:'center'});return}
 submit();
}
function submit(){
 var b=document.getElementById('next'),st=document.getElementById('status');
 b.disabled=true;b.textContent='제출 중...';
 var body={submission_id:sid,name:F.name,sign:F.sign,answers:A};
 function fail(msg){b.disabled=false;b.textContent='동의서 제출';st.textContent=msg}
 if(!DEMO&&!/^https:\/\/script\.google\.com\//.test(ENDPOINT)){fail('저장 서버(Apps Script 웹앱)가 아직 연결되지 않았습니다. 연구조원에게 알려 주십시오.');return}
 var req=DEMO?Promise.resolve({ok:true,demo:true}):fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){return r.json()},function(){throw {net:true}});
 req.then(function(j){if(!j.ok)throw {server:j.error||'unknown'};sent=true;done(j)})
  .catch(function(x){
   if(x&&x.server)fail('저장 중 서버 오류가 발생하였습니다 ('+x.server+'). 연구조원에게 알려 주십시오.');
   else if(x&&x.net)fail('제출에 실패하였습니다. 입력 내용은 유지되어 있으니 인터넷 연결을 확인한 뒤 다시 제출해 주십시오.');
   else fail('서버 응답을 읽지 못하였습니다. 웹앱 배포 설정(액세스 권한: 모든 사용자)을 확인해 주십시오.');
  });
}
function done(j){
 document.getElementById('bar').style.width='100%';
 document.getElementById('stepno').textContent='';
 var h='<p>'+esc(F.name)+' 님, 연구 참여에 동의해 주셔서 감사합니다.</p>';
 if(j.demo)h+='<p class="note">데모 모드: 저장되지 않았습니다.</p>';
 h+='<div class="btns"><button type="button" class="ghost" id="again">처음 화면으로</button></div>';
 app.innerHTML=panel('DONE','제출이 완료되었습니다.',h,'done');
 scrollTo(0,0);
 document.getElementById('again').onclick=function(){location.href=location.pathname+(DEMO?'?demo':'')};
}
window.addEventListener('beforeunload',function(e){if(!sent&&(Object.keys(A).length||F.name)){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
