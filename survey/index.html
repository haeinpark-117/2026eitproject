<style>
:root{--ink:#08080f;--ink2:#12121d;--muted:#6a6a7d;--line:#e8e8ef;--accent:#3840f3;--accent-dk:#2a31d4;--accent-soft:#eef0ff;--accent-line:#d9dcff;--pink:#ff1493;--pink-dk:#d10f78;--pink-soft:#fff0f8;--pink-line:#ffcfe8;--soft:#f5f5f9;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.68 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.topnav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}

.brand{font-weight:800;letter-spacing:-.02em}.brand b{color:var(--accent);font-weight:800}
.stepno{font:13px var(--mono);letter-spacing:.08em;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:0 16px 72px}
header{text-align:center;padding:48px 0 24px}
.pill{display:inline-block;font:13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:4px 14px}
header h1{font-size:44px;line-height:1.15;letter-spacing:-.035em;font-weight:800;margin:16px 0 0;color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:24px 0 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:0 0 16px}
.card.lead{background:var(--accent-soft);border-color:var(--accent-line)}
.card.bad{border-color:var(--pink);background:var(--pink-soft)}
h2{font-size:27px;line-height:1.25;letter-spacing:-.025em;font-weight:800;margin:0 0 10px;color:var(--ink)}

.q{font-weight:700;display:block;margin-bottom:6px;color:var(--ink2);letter-spacing:-.01em}
.req{color:var(--pink)}
.hint{color:var(--muted);font-size:15px;margin:0 0 10px}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;line-height:1.3;padding:8px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.scale label:hover{background:var(--accent-soft)}
.scale label:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}

.grid-item.bad{background:var(--pink-soft);border-radius:10px;padding-left:10px;padding-right:10px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
button{font:inherit;font-weight:700;padding:11px 24px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}

.langs{display:flex;gap:12px;flex-wrap:wrap}

.status{color:var(--pink-dk);margin-top:12px;min-height:1.6em}
[hidden]{display:none!important}

body{font-size:17px}
.topnav div{max-width:960px;padding:0 20px}
main{max-width:960px;padding:0 20px 72px}
header{text-align:center;padding:52px 0 36px;background:radial-gradient(ellipse 60% 70% at 50% 0,#f5f5fc,transparent)}
header h1{font-size:64px;letter-spacing:-.045em}
header.compact{padding:24px 0 20px}header.compact h1{font-size:30px;margin-top:10px}
.pill{letter-spacing:.14em}
.bar{max-width:420px;margin:22px auto 0;height:5px}
.panel{position:relative;border-radius:22px;padding:40px 30px 22px;border:1px solid var(--accent-line);background:var(--accent-soft);margin:30px 0 0}
.panel.pk{background:var(--pink-soft);border-color:var(--pink-line)}
.badge{position:absolute;top:-15px;left:28px;background:var(--accent);color:#fff;font:700 13px var(--mono);letter-spacing:.14em;padding:6px 16px;border-radius:999px}
.pk>.badge{background:var(--pink)}
.panel h2{font-size:26px;margin-bottom:8px}
.panel>p{margin:0 0 12px}
.panel .card{background:transparent;border:0;border-top:1px solid var(--accent-line);border-radius:0;padding:16px 0;margin:0}
.panel .card.bad{background:var(--pink-soft);outline:2px solid var(--pink);outline-offset:-2px;border-radius:10px;padding:16px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.panel>h2+.card,.panel>h2+.two>.card,.panel>.hint+.card,.panel>.hint+.two>.card{border-top:0}
.panel>.hint{margin-bottom:6px}
.panel .short,.row{max-width:none}
.grid-item{border-top:1px solid var(--accent-line)}
.scale label{background:#fff;border-color:var(--accent-line)}
label.opt:has(input:checked){background:#fff}
input[type=text],input[type=number],textarea,select{border-color:var(--accent-line)}
.nav{margin-top:26px}.nav button{padding:12px 30px;border-radius:12px}
@media(max-width:700px){.two{grid-template-columns:1fr}.two>.card+.card{border-top:1px solid var(--accent-line)}header{padding:32px 0 20px}header h1{font-size:38px}.panel{padding:36px 18px 16px}}
</style>

 items:['I tried to repeat as many words as possible exactly as I heard them, rather than focusing on the meaning of the sentence.','I tried to convey the main message of the sentence rather than the individual words.','I tried to pay attention to the accuracy (e.g., grammar, pronunciation) of the English I was repeating.','I tried to understand the meaning of the whole sentence before repeating it.','I tried to notice words, expressions, and sentence structures that I already knew in the sentence.','While listening to the sentence, I paid particular attention to key words or expressions.','I translated the English sentence I heard into my first language in my head to understand it, and then repeated it in English.','Before repeating, I silently rehearsed the sentence I heard once in my mind.','I tried to remember the content of the sentence by connecting it to everyday situations that I might actually experience.','I tried to divide long sentences into smaller units so that I could understand and remember them part by part.','I focused on a specific part of the sentence (e.g., the beginning or the end) rather than the whole sentence and prioritized repeating that part.','When I could not think of the exact expression, I replaced it with another expression with a similar meaning.','When I could not think of a particular word, I filled the gap with a word such as "something."','I guessed the parts I could not hear well based on the surrounding context.','When I did not understand the meaning, I imitated the sounds I heard regardless of their meaning.'],
 otherStrat:'If you used any method not listed above, please describe it in detail.',
 s2:'II. Background and English Learning Questionnaire',
 s2a:'The items below are intended to gather basic information about participants and their English learning background. Please mark the appropriate option or fill in the blanks. Your responses will be used for research purposes only and will not be disclosed in a form that can identify you.',
 h1:'1. Basic Information', gender:'Gender', genderOpts:[['male','Male'],['female','Female']],
 age:'Age', ageH:'Please enter your age in years as a number. (e.g., 23)', major:'Major',
 l1:'First language', l1Opts:[['korean','Korean'],['english','English'],['other','Other:']],
 h2:'2. English Learning Background',
 startAge:'Age at which you first began learning English', startAgeH:'Please enter your age in years as a number. (e.g., 8) Native speakers of English may skip this item.',
 years:'Total length of English study', yearsH:'Please enter the approximate number of years. (e.g., 12) Native speakers of English may skip this item.',
 abroad:'Experience living or staying in an English-speaking country', abroadOpts:[['no','No'],['yes','Yes']],
 stay:'Length of residence or stay in an English-speaking country', stayH:'Please enter a number and select the unit. (e.g., 18 / Months)', unitPick:'Select unit', units:[['years','Years'],['months','Months']],
 freq:'Current frequency of English use (daily life, work, study, etc.)', freqOpts:[['rarely','Rarely'],['w1_2','1-2 times a week'],['w3_5','3-5 times a week'],['daily','Almost every day']],
 speak:'Choose the option that best describes your English speaking ability.',
 speakOpts:['Unable to speak','Can express only very basic words or sentences','Can hold short everyday conversations','Can describe personal experiences or life in simple sentences','Can discuss or explain specific professional fields or topics','Can use the language freely in any situation'],
 listen:'Choose the option that best describes your English listening ability.',
 listenOpts:['Unable to understand spoken English','Can understand very basic words or sentences','Can understand high-frequency words and expressions','Can grasp the main points of everyday conversations','Can understand long speeches and lectures','Can comfortably understand any kind of conversation'],
 read:'Choose the option that best describes your English reading ability.',
 readOpts:['Unable to read','Can understand basic names, words, or sentences','Can understand short, simple texts','Can understand texts on familiar everyday content','Can understand long, somewhat complex texts','Can comfortably read and understand any kind of text'],
 write:'Choose the option that best describes your English writing ability.',
 writeOpts:['Unable to write','Can write short postcards or documents','Can write short memos','Can write simple texts on specific topics','Can write detailed texts on various fields of interest','Can write fluently and smoothly in various genres'],
 h3:'3. Standardized English Test Scores', h3H:'If you have taken a standardized English test within the last two years, please enter it below. (Complete only the tests that apply.)',
 testSuffix:' - score/level and test date', testH:'Please enter your score (level) and test date. (e.g., 850 / March 2025)', opicH:'Please enter your level and test date. (e.g., IH / March 2025)',
 next:'Next', back:'Back', submit:'Submit', sending:'Submitting...',
 errReq:'This item is required.', errNum:'Please enter a valid number.', errFix:'Please check the marked items.',
 errSend:'Submission failed. Your answers have been kept. Please check your internet connection and submit again.',

}};

var TESTS=[['toeic','TOEIC'],['opic','OPIc'],['toefl_ibt','TOEFL iBT'],['ielts','IELTS']];
var A={}, lang=null, step=0, sent=false;
var sid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
var app=document.getElementById('app');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(k){return A[k]==null?'':A[k]}
function radios(k,opts){return opts.map(function(o){return '<label class="opt"><input type="radio" name="'+k+'" value="'+esc(o[0])+'"'+(v(k)===String(o[0])?' checked':'')+'><span>'+esc(o[1])+'</span></label>'}).join('')}
function levels(a){return a.map(function(t,i){return [String(i+1),(i+1)+'. '+t]})}
function card(k,label,req,hint,body,extra){return '<section class="card" data-k="'+k+'"'+(extra||'')+'><span class="q">'+esc(label)+(req?' <span class="req">*</span>':'')+'</span>'+(hint?'<p class="hint">'+esc(hint)+'</p>':'')+body+'<div class="errmsg"></div></section>'}
function txt(k,cls){return '<input class="'+(cls||'')+'" type="text" name="'+k+'" value="'+esc(v(k))+'" autocomplete="off">'}
function num(k,min,max,stp){return '<input class="short" type="number" inputmode="decimal" name="'+k+'" min="'+min+'" max="'+max+'" step="'+stp+'" value="'+esc(v(k))+'">'}
function nav(backOn,label){return '<div class="status" id="status"></div><div class="nav">'+(backOn?'<button type="button" class="ghost" id="back">'+esc(T[lang].back)+'</button>':'<span></span>')+'<button type="button" id="next">'+esc(label)+'</button></div>'}

function panel(badge,title,body,cls){return '<section class="panel '+(cls||'')+'"><span class="badge">'+esc(badge)+'</span>'+(title?'<h2>'+title+'</h2>':'')+body+'</section>'}
function pair(a,b){return '<div class="two">'+a+b+'</div>'}
function render(){
 var t=T[lang], h='';
 document.documentElement.lang=lang;
 document.getElementById('title').textContent=t.title;
 document.title=t.title;
 document.getElementById('barWrap').hidden=false;
 document.getElementById('bar').style.width=(step/3*100)+'%';
 document.getElementById('stepno').textContent=(step+1)+' / 3';
 document.querySelector('header').className=step?'compact':'';
 if(step===0){
  h+=panel('STUDY',t.studyT,'<p class="intro">'+esc(t.intro)+(CONTACT?esc(t.contact+CONTACT)+'\n':'')+esc(t.irb)+'</p><p>'+esc(t.privacy)+'</p>','pk');
  h+=panel('PARTICIPANT',t.infoT,card('group',t.group,1,'',radios('group',t.groupOpts))+pair(card('name',t.name,1,'',txt('name','short')),card('participant_id',t.pid,1,'',txt('participant_id','short'))));
  h+=nav(false,t.next);
 } else if(step===1){
  h+=panel('PART I',t.s1,'<p>'+esc(t.s1a)+'</p><p>'+esc(t.s1b)+'</p>','pk');
  var g='<p class="hint">'+esc(t.gridH)+'</p>';
  t.items.forEach(function(it,i){var k='s'+(i+1);
   g+='<div class="grid-item" data-k="'+k+'"><div>'+(i+1)+'. '+esc(it)+'</div>'+(i===6&&t.s7Skip?'<p class="hint">'+esc(t.s7Skip)+'</p>':'')+'<div class="scale">'+t.scale.map(function(s,j){return '<label><input type="radio" name="'+k+'" value="'+(j+1)+'"'+(v(k)===String(j+1)?' checked':'')+'><span>'+esc(s)+'</span></label>'}).join('')+'</div><div class="errmsg"></div></div>'});
  h+=panel('STRATEGIES',t.gridT+' <span class="req">*</span>',g);
  h+=panel('OTHER','',card('strategy_other',t.otherStrat,0,'','<textarea name="strategy_other">'+esc(v('strategy_other'))+'</textarea>'));
  h+=nav(true,t.next);
 } else {
  h+=panel('PART II',t.s2,'<p>'+esc(t.s2a)+'</p>','pk');
  h+=panel('BASIC',t.h1,pair(card('gender',t.gender,1,'',radios('gender',t.genderOpts)),card('age',t.age,1,t.ageH,num('age',1,120,1)))+pair(card('major',t.major,1,'',txt('major')),card('l1',t.l1,1,'',radios('l1',t.l1Opts)+'<div id="l1o"'+(v('l1')==='other'?'':' hidden')+'>'+txt('l1_other')+'</div>')));
  var e=pair(card('start_age',t.startAge,1,t.startAgeH,num('start_age',0,120,1)),card('study_years',t.years,1,t.yearsH,num('study_years',0,120,'any')));
  e+=pair(card('abroad',t.abroad,1,'',radios('abroad',t.abroadOpts)),card('stay',t.stay,1,t.stayH,'<div class="row"><input type="number" inputmode="decimal" name="stay_value" min="0" step="any" value="'+esc(v('stay_value'))+'"><select name="stay_unit"><option value="">'+esc(t.unitPick)+'</option>'+t.units.map(function(u){return '<option value="'+u[0]+'"'+(v('stay_unit')===u[0]?' selected':'')+'>'+esc(u[1])+'</option>'}).join('')+'</select></div>',v('abroad')==='yes'?'':' hidden'));
  e+=card('use_freq',t.freq,1,'',radios('use_freq',t.freqOpts));
  e+=pair(card('self_speaking',t.speak,1,'',radios('self_speaking',levels(t.speakOpts))),card('self_listening',t.listen,1,'',radios('self_listening',levels(t.listenOpts))));
  e+=pair(card('self_reading',t.read,1,'',radios('self_reading',levels(t.readOpts))),card('self_writing',t.write,1,'',radios('self_writing',levels(t.writeOpts))));
  h+=panel('ENGLISH',t.h2,e);
  var c=TESTS.map(function(x){return card('test_'+x[0],x[1]+t.testSuffix,0,x[0]==='opic'?t.opicH:t.testH,txt('test_'+x[0]))});
  h+='<div id="tests"'+(v('l1')==='english'?' hidden':'')+'>'+panel('SCORES',t.h3,'<p class="hint">'+esc(t.h3H)+'</p>'+pair(c[0],c[1])+pair(c[2],c[3]))+'</div>'+nav(true,t.submit);
 }
 app.innerHTML=h;
 var b=document.getElementById('back'); if(b)b.onclick=function(){collect();step--;render();scrollTo(0,0)};
 document.getElementById('next').onclick=onNext;
 app.onchange=app.oninput=function(e){collect();
  if(step===2){
   var o=document.getElementById('l1o'); o.hidden=v('l1')!=='other';
   document.getElementById('tests').hidden=v('l1')==='english';
   document.querySelector('[data-k=stay]').hidden=v('abroad')!=='yes';
  }
  var c=e.target.closest('.bad'); if(c){c.classList.remove('bad')}
 };
}
function collect(){app.querySelectorAll('input,textarea,select').forEach(function(e){
 if(e.type==='radio'){if(e.checked)A[e.name]=e.value}else A[e.name]=e.value.trim()})}
function isNum(x,min,max){if(x===''||isNaN(Number(x)))return false;var n=Number(x);return n>=min&&n<=max}
function bad(k,msg,list){var c=app.querySelector('[data-k="'+k+'"]');if(!c)return;c.classList.add('bad');var m=c.querySelector('.errmsg');if(m)m.textContent=msg;list.push(c)}
function validate(){
 var t=T[lang],e=[];
 app.querySelectorAll('.bad').forEach(function(c){c.classList.remove('bad')});
 function req(k){if(!v(k))bad(k,t.errReq,e)}
 function n(k,min,max){if(!v(k))bad(k,t.errReq,e);else if(!isNum(v(k),min,max))bad(k,t.errNum,e)}
 if(step===0){req('group');req('name');req('participant_id')}
 if(step===1){for(var i=1;i<=15;i++)if(!(i===7&&lang==='en'))req('s'+i)}
 if(step===2){
  req('gender');n('age',1,120);req('major');req('l1');
  if(v('l1')==='other'&&!v('l1_other'))bad('l1',t.errReq,e);
  var nat=v('l1')==='english';
  if(!nat||v('start_age'))n('start_age',0,120);
  if(!nat||v('study_years'))n('study_years',0,120);
  req('abroad');
  if(v('abroad')==='yes'){
   if(!v('stay_value')||!v('stay_unit'))bad('stay',t.errReq,e);
   else if(!isNum(v('stay_value'),0.01,1200))bad('stay',t.errNum,e);
  }
  ['use_freq','self_speaking','self_listening','self_reading','self_writing'].forEach(req);
 }
 return e;
}
function payload(){
 var p={submission_id:sid,lang:lang};
 Object.keys(A).forEach(function(k){p[k]=A[k]});
 if(v('l1')!=='other')p.l1_other='';
 if(v('abroad')!=='yes'){p.stay_value='';p.stay_unit='';p.stay_months=''}
 else p.stay_months=Math.round(Number(v('stay_value'))*(v('stay_unit')==='years'?12:1)*100)/100;
 if(v('l1')==='english')TESTS.forEach(function(x){p['test_'+x[0]]=''});
 return p;
}
function onNext(){
 collect();
 var t=T[lang],e=validate(),st=document.getElementById('status');
 if(e.length){st.textContent=t.errFix;e[0].scrollIntoView({block:'center'});return}
 if(step<2){step++;render();scrollTo(0,0);return}
 var b=document.getElementById('next');b.disabled=true;b.textContent=t.sending;st.textContent='';
 fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload())})
 .then(function(r){return r.json()})
 .then(function(j){if(!j.ok)throw new Error(j.error||'failed');sent=true;
  document.getElementById('bar').style.width='100%';document.getElementById('stepno').textContent='';
  app.innerHTML='<section class="card"><h2>'+esc(t.done)+'</h2><p>'+esc(t.thanks)+'</p></section>';scrollTo(0,0)})
 .catch(function(){b.disabled=false;b.textContent=t.submit;st.textContent=t.errSend});
}
window.addEventListener('beforeunload',function(e){if(lang&&!sent&&Object.keys(A).length){e.preventDefault();e.returnValue=''}});
function start(l){lang=l;render();scrollTo(0,0)}
var q=new URLSearchParams(location.search).get('lang');
if(q==='ko'||q==='en')start(q);
else{app.innerHTML='<section class="card"><h2>언어 선택 / Select a language</h2><div class="langs"><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">English</button></div></section>';
 app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){start(b.dataset.l)}})}
</script>
</body>
</html>
