<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>2026 EIT Project</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b12;--body:#55566a;--line:#e4e4ee;--blue:#2f35f5;--blue-bg:#ebedff;--blue-line:#cfd3fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font:400 17px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
nav{height:60px;display:flex;align-items:center;padding:0 36px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:-.02em}
nav b{color:var(--blue);font-weight:800;margin-left:.3em}
main{max-width:1140px;margin:0 auto;padding:56px 36px}
h1{font-size:clamp(36px,5vw,54px);line-height:1.08;letter-spacing:-.04em;font-weight:800;margin:0 0 36px;text-align:center}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.page{display:block;padding:28px 30px;border-radius:18px;border:1px solid var(--blue-line);background:var(--blue-bg);color:inherit;text-decoration:none}
.page:hover{border-color:var(--blue)}
.page h2{font-size:22px;letter-spacing:-.025em;margin:0 0 6px;font-weight:800}
.page span{font-weight:600;color:var(--blue)}
@media (max-width:820px){nav{padding:0 16px}main{padding:36px 16px}}
</style>
</head>
<body>
<nav>2026 EIT <b>Project</b></nav>
<main>
  <h1>2026 EIT Project</h1>
  <div class="pages">
    <!-- Add one link per sub-page -->
    <a class="page" href="icf/">
      <h2>Informed Consent</h2>
      <span>Open &rarr;</span>
    </a>
    <a class="page" href="oral-narrative-task/">
      <h2>Oral Narrative Task</h2>
      <span>Open &rarr;</span>
    </a>
    <a class="page" href="lvlt/">
      <h2>Listening Vocabulary Levels Test</h2>
      <span>Open &rarr;</span>
    </a>
  </div>
</main>
</body>
</html>
